<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', () => {
        let handleCopyClick = document.querySelector('.sr-permant-link-copy-trigger');
        let handleShareClick = document.querySelector('.sr-permant-link-share-trigger');
        let permLinkInput = document.querySelector('.sr-copy-link-input');
        let url = permLinkInput.value;
        handleCopyClick.addEventListener('click', () => {
            document.activeElement.blur();
            let copyImg = document.querySelector('.sr-permant-link-copy-trigger img');
            let imgUrl = copyImg.src;
            navigator.clipboard.writeText(url).then(() => {
                console.log('URL copied to clipboard');
                copyImg.src = 'Customizing/global/plugins/Services/UIComponent/UserInterfaceHook/SrUI/templates/copied.svg';
                setTimeout(() => {
                    copyImg.src = imgUrl;
                }, 2000);
            }).catch((error) => {
                console.error('Failed to copy URL to clipboard', error);
            });
        });

        if (navigator.share !== undefined) {
            handleShareClick.style.display = 'block';
        }

        handleShareClick.addEventListener('click', async () => {
            document.activeElement.blur();
            const data = {
                url: url,
            };

            try {
                await navigator.share(data);
            } catch (err) {
                console.error('Error sharing URL: ', err);
            }
        });
        permLinkInput.addEventListener('click', () => {
            permLinkInput.select();
            permLinkInput.setSelectionRange(0, 99999);
        });
    });
</script>
<style>
    .sr-copy-link-container {
        box-sizing: border-box;
        padding-top: 0;
        padding-bottom: 0;
        padding-left: 0;
    / / border-radius: 5 px;
        overflow: hidden;
    }

    .sr-copy-link-input {
        border: none;
        width: 250px;
        background-color: transparent;
        display: inline-block;
        height: 22px;
        margin-left: 10px;
    }

    .sr-permant-link-copy-trigger, .sr-permant-link-share-trigger {
        margin: -1px;
        display: inline-block;
        float: left;
    }

    .sr-copy-link-container img {
        width: 15px;
        height: 15px;
        color: white;
        filter: invert(100%);
    }

    .sr-permant-link-trigger:hover img {
        filter: invert(0%);
    }

</style>

<div class="sr-copy-link-container btn btn-default">
    <span style="display: none">{LABEL}: </span>

    <button class="sr-permant-link-share-trigger btn btn-default" style="display: none">
        <img src="Customizing/global/plugins/Services/UIComponent/UserInterfaceHook/SrUI/templates/share.svg">
    </button>

    <button class="sr-permant-link-copy-trigger btn btn-default">
        <img src="Customizing/global/plugins/Services/UIComponent/UserInterfaceHook/SrUI/templates/copy.svg">
    </button>

    <input class="sr-copy-link-input" type="text" value="{ACTION}" readonly>
</div>
